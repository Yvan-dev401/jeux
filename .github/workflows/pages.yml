# Publie le site sur GitHub Pages à chaque envoi sur la branche principale.
#
# À activer une seule fois : Settings → Pages → Source : « GitHub Actions ».
# Le site étant à la racine du dépôt, l'autre méthode (Source : « Deploy from
# a branch », dossier « / (root) ») fonctionne aussi, sans ce fichier.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans interrompre celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lancer les tests
        run: npm test

  publier:
    name: Publier
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Préparer le site
        # Le site est à la racine ; on écarte ce qui n'a pas à être publié.
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' \
                --exclude 'tests' --exclude 'package.json' --exclude 'node_modules' \
                ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
