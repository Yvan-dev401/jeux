<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Jeux</title>
  <!-- Page autonome : GitHub Pages la sert pour n'importe quelle URL, à
       n'importe quelle profondeur, donc elle n'utilise aucun fichier externe. -->
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      gap: 6px;
      padding: 32px 20px;
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
        system-ui, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      color: #ecebe5;
      background-color: #070b08;
    }
    .etiquette {
      justify-self: center;
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fbd509;
    }
    h1 {
      margin: 14px 0 8px;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.035em;
      line-height: 1.02;
    }
    p { margin: 0 auto; max-width: 46ch; color: #969d97; }
    a.bouton {
      justify-self: center;
      margin-top: 26px;
      padding: 15px 26px;
      background: #fbd509;
      color: #070b08;
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <p class="etiquette">Erreur 404</p>
  <h1>Cette page a filé en douce.</h1>
  <p>
    La page demandée n'existe pas, ou la soirée qu'elle contenait est terminée.
    Retourne au catalogue pour relancer une partie.
  </p>
  <a class="bouton" id="lien-accueil" href="/">Retour au catalogue</a>

  <script>
    // Le site peut être publié à la racine d'un domaine ou sous /<depot>/ :
    // on retrouve sa racine à partir de l'URL courante.
    (function () {
      var racine = '/';
      if (location.hostname.endsWith('github.io')) {
        var premier = location.pathname.split('/').filter(Boolean)[0];
        if (premier) racine = '/' + premier + '/';
      }
      document.getElementById('lien-accueil').setAttribute('href', racine);
    })();
  </script>
</body>
</html>
