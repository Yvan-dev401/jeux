<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Jeux</title>
  <!-- Page autonome : GitHub Pages la sert pour n'importe quelle URL, à
       n'importe quelle profondeur, donc elle n'utilise aucun fichier externe. -->
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      gap: 6px;
      padding: 32px 20px;
      font: 17px/1.6 "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      text-align: center;
      color: #f6f3ff;
      background-color: #0b0917;
      background-image:
        radial-gradient(700px 420px at 20% 0%, rgba(255, 46, 136, 0.25), transparent 60%),
        radial-gradient(700px 460px at 85% 10%, rgba(139, 92, 246, 0.25), transparent 62%);
    }
    .etiquette {
      justify-self: center;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #b7b0d4;
    }
    h1 {
      margin: 14px 0 8px;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      letter-spacing: -0.02em;
    }
    p { margin: 0 auto; max-width: 46ch; color: #b7b0d4; }
    a.bouton {
      justify-self: center;
      margin-top: 26px;
      padding: 14px 26px;
      border-radius: 999px;
      background-image: linear-gradient(135deg, #ff2e88, #ffb020);
      color: #170a18;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <p class="etiquette">Erreur 404</p>
  <h1>Cette page a filé en douce</h1>
  <p>
    La page demandée n'existe pas, ou la soirée qu'elle contenait est terminée.
    Retourne au catalogue pour relancer une partie.
  </p>
  <a class="bouton" id="lien-accueil" href="/">Retour au catalogue</a>

  <script>
    // Le site peut être publié à la racine d'un domaine ou sous /<depot>/ :
    // on retrouve sa racine à partir de l'URL courante.
    (function () {
      var racine = '/';
      if (location.hostname.endsWith('github.io')) {
        var premier = location.pathname.split('/').filter(Boolean)[0];
        if (premier) racine = '/' + premier + '/';
      }
      document.getElementById('lien-accueil').setAttribute('href', racine);
    })();
  </script>
</body>
</html>
